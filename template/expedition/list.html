<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=*, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Expeditions list</h1>
    <ul>
        {% for expedition in list %}
            <li><a href="{% url 'detail' expedition.id %}">{{ expedition.reference }} - {{ expedition.entreprise }} - {{ expedition.date_depart }} - {{ expedition.date_retour }}</a></li>
            {%empty%}
                No expedition  
        {% endfor %}
                
    </ul>
    
    
</body>
</html>
